<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Portrait v2 (pilot: The Factory). Reference 1080×1920 (9:16). The original page is ../ -->
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Five Daughters Bakery — Menu (Portrait v2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Connection warning banner (hidden by default) -->
  <div id="connection-warning" class="connection-warning hidden" aria-live="polite">
    <span class="warning-icon">⚠</span>
    Menu data unavailable — showing last known menu
  </div>

  <!-- Header -->
  <header class="header">
    <img src="../logo.png" alt="Five Daughters Bakery" class="header-logo" />
    <span id="location-name" class="header-location"></span>
  </header>

  <!-- Pastry menu -->
  <main id="menu-root" class="menu-root" aria-label="Menu">
    <div class="loading-state">
      <span class="loading-text">Loading menu…</span>
    </div>
  </main>

  <!-- Rotating panel: drinks · promos · featured · staff picks (panel.js + panel-views.js) -->
  <section id="panel" class="panel" aria-live="off"></section>

  <!-- Footer -->
  <footer class="footer">
    <span id="footer-location" class="footer-location"></span>
    <span class="footer-sep" aria-hidden="true">·</span>
    <span id="footer-updated" class="footer-updated"></span>
  </footer>

  <script src="menu.js"></script>
  <script src="panel-views.js"></script>
  <script src="panel.js"></script>
</body>
</html>
